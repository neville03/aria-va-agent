<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARIA — Personal Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0e11; --surface: #13151a; --card: #181b22; --border: #252830;
    --accent: #c8a96e; --accent2: #e8c98e; --text: #e8e6e0; --muted: #7a7872;
    --dim: #3a3c42; --success: #4caf7d; --info: #6ba3d6; --danger: #e06b6b;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }

  .app { display: grid; grid-template-columns: 280px 1fr 260px; grid-template-rows: 56px 1fr; height: 100vh; }

  .topbar { grid-column: 1/-1; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); gap: 16px; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--accent); letter-spacing: 0.05em; }
  .logo span { color: var(--muted); font-size: 13px; font-family: 'DM Mono', monospace; margin-left: 8px; font-weight: 300; }
  
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); margin-left: auto; }
  .status-dot.thinking { background: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-label { font-size: 11px; color: var(--muted); }

  .sidebar-left, .sidebar-right { background: var(--surface); padding: 20px 16px; overflow-y: auto; }
  .sidebar-left { border-right: 1px solid var(--border); }
  .sidebar-right { border-left: 1px solid var(--border); }
  
  .sidebar-section { margin-bottom: 28px; }
  .sidebar-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

  .quick-btn { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 6px; transition: 0.15s; }
  .quick-btn:hover { border-color: var(--accent); background: rgba(200,169,110,0.05); color: var(--accent2); }

  .chat-area { display: flex; flex-direction: column; overflow: hidden; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  
  .msg { display: flex; gap: 12px; animation: fadein 0.3s ease; max-width: 700px; }
  @keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: 'DM Serif Display', serif; }
  .aria-avatar { background: rgba(200,169,110,0.1); border: 1px solid var(--accent); color: var(--accent); }
  .user-avatar { background: var(--card); border: 1px solid var(--border); color: var(--muted); }

  .msg-bubble { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; font-size: 13px; line-height: 1.7; color: var(--text); }
  .msg.user .msg-bubble { background: rgba(200,169,110,0.08); border-color: rgba(200,169,110,0.2); }

  .input-bar { padding: 16px 24px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; }
  #chat-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; padding: 10px 14px; resize: none; min-height: 40px; }
  .send-btn { background: var(--accent); color: #0d0e11; border: none; border-radius: 8px; width: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .send-btn:disabled { opacity: 0.3; }

  .empty-state { color: var(--dim); font-size: 11px; text-align: center; padding: 16px 0; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">ARIA <span>/ Virtual Assistant Agent</span></div>
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">ready</span>
    </div>
  </header>

  <aside class="sidebar-left">
    <div class="sidebar-section">
      <div class="sidebar-label">Quick actions</div>
      <button class="quick-btn" onclick="sendQuick('Give me my daily briefing')">◈ Daily briefing</button>
      <button class="quick-btn" onclick="sendQuick('Show me all my pending tasks')">◉ View tasks</button>
      <button class="quick-btn" onclick="sendQuick('What reminders do I have?')">◷ View reminders</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Tasks <span id="task-count" style="color:var(--accent); margin-left:8px;"></span></div>
      <div id="tasks-list"><div class="empty-state">No tasks yet</div></div>
    </div>
  </aside>

  <main class="chat-area">
    <div class="messages" id="messages">
      <div class="msg">
        <div class="msg-avatar aria-avatar">A</div>
        <div class="msg-body">
          <div class="msg-bubble">Good day. I am <strong>ARIA</strong>. How can I help you manage your workflow today?</div>
        </div>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="chat-input" placeholder="Tell ARIA what you need..." rows="1"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
    </div>
  </main>

  <aside class="sidebar-right">
    <div class="sidebar-section">
      <div class="sidebar-label">Reminders</div>
      <div id="reminders-list"><div class="empty-state">No reminders set</div></div>
    </div>
  </aside>
</div>

<script>
  // Updated with your actual Railway URL
  const API = "https://web-production-bf893.up.railway.app"; 
  const SESSION = "aria_" + Math.random().toString(36).slice(2);
  let isThinking = false;

  async function sendMessage(override) {
    if (isThinking) return;
    const input = document.getElementById("chat-input");
    const text = override || input.value.trim();
    if (!text) return;

    appendMessage("user", text);
    input.value = "";
    setLoading(true);

    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: SESSION })
      });
      
      const data = await res.json();
      if (data.error) {
          appendMessage("assistant", "Error: " + data.error);
      } else {
          appendMessage("assistant", data.reply);
      }
      refreshState();
    } catch(e) {
      appendMessage("assistant", "Could not reach ARIA. Ensure the Railway service is active.");
    } finally {
      setLoading(false);
    }
  }

  function appendMessage(role, content) {
    const container = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${role === 'user' ? 'user' : ''}`;
    div.innerHTML = `
      <div class="msg-avatar ${role === 'user' ? 'user-avatar' : 'aria-avatar'}">${role === 'user' ? 'U' : 'A'}</div>
      <div class="msg-body">
        <div class="msg-name">${role === 'user' ? 'You' : 'ARIA'}</div>
        <div class="msg-bubble">${content}</div>
      </div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function setLoading(loading) {
    isThinking = loading;
    document.getElementById("send-btn").disabled = loading;
    document.getElementById("status-dot").className = loading ? "status-dot thinking" : "status-dot";
    document.getElementById("status-label").textContent = loading ? "thinking..." : "ready";
  }

  function sendQuick(msg) { sendMessage(msg); }

  async function refreshState() {
    try {
      const res = await fetch(`${API}/state`);
      const state = await res.json();
      renderTasks(state.tasks || []);
    } catch(e) {}
  }

  function renderTasks(tasks) {
    const el = document.getElementById("tasks-list");
    const pending = tasks.filter(t => !t.done);
    document.getElementById("task-count").textContent = pending.length ? `(${pending.length})` : "";
    
    if (!tasks.length) {
      el.innerHTML = '<div class="empty-state">No tasks yet</div>';
      return;
    }

    el.innerHTML = tasks.slice(-5).reverse().map(t => `
      <div style="font-size:11px; padding:6px 0; border-bottom:1px solid var(--border); color:${t.done ? 'var(--muted)' : 'var(--text)'}">
        ${t.done ? '✓' : '○'} ${t.title}
      </div>
    `).join("");
  }

  document.getElementById("chat-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Initial sync
  refreshState();
  setInterval(refreshState, 20000);
</script>
</body>
</html>
